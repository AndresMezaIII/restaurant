<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <h1>Tables</h1>

    <!-- Basic table structure example 1 -->
  <h2>Staff Table</h2>
  <p>This is a basic table.</p>
  <table>
    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Role</th>
        </tr>
        <tbody>
            <tr>
                <td>E43</td>
                <td>Bill Evans</td>
                <td>Chef</td>
            </tr>
            <tr>
                <td>E44</td>
                <td>Laura Evans</td>
                <td>Manager</td>
            </tr>
        </tbody>
    </thead>
  </table>
</body>
</html>
