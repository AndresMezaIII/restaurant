<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Reservation</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/forms.css" />
    <script
      src="https://kit.fontawesome.com/337be747ec.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="header">
      <p><i class="fa-solid fa-bars"></i></p>
      <div class="logoSlogan">
        <h1 class="logo">The Royal Lounge</h1>
        <h5 class="slogan">Est. 2026</h5>
      </div>
      <img src="assets/pics/seal.png" alt="A royal seal" class="seal" />
      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="reservations.html">Reservations</a>
        <a href="createReservation">Make a Reservation</a>
      </nav>
      <p><i class="fa-solid fa-cart-shopping"></i></p>
    </header>
    <main>
      <div class="reservation-wrapper">
        <div class="reservation-header">
          <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit.</p>
        </div>
        <form class="reservation-form">
          <fieldset>
            <legend>Contact Information:</legend>
            <div class="form-row">
              <div class="form-group">
                <label>First Name: </label>
                <input type="text" id="fname" name="fname" required />
                <div class="form-group">
                  <label>Last Name: </label>
                  <input type="text" id="lname" name="lname" required /><br />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Telephone: </label>
                  <input type="tel" id="telephone" name="tel" required />
                </div>
                <div class="form-group">
                  <label>E-mail: </label>
                  <input type="email" id="email" name="email" /><br />
                </div>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>Reservation details:</legend>
            <div class="form-row">
              <div class="form-group">
                <label for="date">Date: </label>
                <input type="date" id="date" name="date" />
              </div>
              <div class="form-group">
                <label>Time: </label>
                <input type="time" id="time" name="time" />
              </div>
              <div class="form-group">
                <label>Number of Guests: </label>
                <input
                  type="number"
                  id="guests"
                  name="guests"
                  min="1"
                  max="30"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Table Preference: </label>
              <select>
                <option value="" disabled selected>Select an option</option>
                <option name="outside" id="outside">Outdoor Patio</option>
                <option name="bar" id="bar">Bar Area</option>
                <option name="booth" id="booth">Booth</option>
                <option name="window" id="window">Window Seat</option>
                <option name="none" id="none">No preference</option>
              </select>
            </div>
          </fieldset>
          <fieldset>
            <legend>Occasion:</legend>
            <div class="radio-group">
              <!-- wrap in spans-->
              <label class="radio-option">Just Dinner</label>
              <input type="radio" name="occasion" id="occasion" />
              <label class="radio-option">Birthday</label>
              <input type="radio" name="occasion" id="occasion" />
              <label class="radio-option">Anniversary</label>
              <input type="radio" nme="occasion" id="occasion" />
              <label class="radio-option">Business</label>
              <input type="radio" name="occasion" id="occasion" />
            </div>
          </fieldset>
          <fieldset>
            <!-- wrap in spans -->
            <legend>Dietary Needs:</legend>
            <label class="checkbox-option">
              <input type="checkbox" name="dietary-needs" id="dietary-needs" />
              <span>Vegetarian</span>
            </label>
            <label>Gluten-free</label>
            <input type="checkbox" name="dietary-needs" id="dietary-needs" />
            <label>Food Allergies</label>
            <input type="checkbox" name="dietary-needs" id="dietary-needs" />
            <label class="checkbox-option">
              <input type="checkbox" name="dietary-needs" id="dietary-needs" />
              <span>Vegan</span>
            </label>
          </fieldset>
          <button type="submit" class="submit-btn">Confirm Reservation</button>
        </form>
      </div>
    </main>
  </body>
</html>
