<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Reservation</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/forms.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/337be747ec.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>

    <header class="header">
      
      <p><i class="fa-solid fa-bars"></i></p>
      
      <div class="logoSlogan">
        <h1 class="logo">The Royal Lounge</h1>
        <h5 class="slogan">Est. 2026</h5>
      </div>
      
      <!--<img src="assets/pics/seal.png" alt="A royal seal" class="seal" />-->
      
      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="reservations.html">Reservations</a>
        <a href="createReservation">Make a Reservation</a>
        <div class="payment">
          <a href="paymentInfo.html"
            ><img src="assets/pics/cards.png" class="ccards"
          /></a>
      
      </nav>
      
      <p><i class="fa-solid fa-cart-shopping"></i></p>
    </header>

    <main>

      <div class="reservation-wrapper">

        <div class="reservation-header">

          <p>How can we accomodate your party?</p>
        
        </div>
        
        <form class="reservation-form">
          
          <fieldset>
            <legend>Contact Information:</legend>
            <div class="form-row">
              <div class="form-group">
                <label>First Name: </label>
                <input type="text" id="fname" name="fname" required />
              </div>
              <div class="form-group">
                  <label>Last Name: </label>
                  <input type="text" id="lname" name="lname" required />
              </div>
            </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Telephone: </label>
                  <input type="tel" id="telephone" name="tel" required />
                </div>
                <div class="form-group">
                  <label>E-mail: </label>
                  <input type="email" id="email" name="email" /><br />
                </div>
              </div>
          </fieldset>

          <fieldset>
            <legend>Reservation details:</legend>
            <div class="form-row">
              <div class="form-group">
                <label for="date">Date: </label>
                <input type="date" id="date" name="date" />
              </div>
              <div class="form-group">
                <label>Time: </label>
                <input type="time" id="time" name="time" />
              </div>
              <div class="form-group">
                <label>Guests: </label>
                <input
                  type="number"
                  id="guests"
                  name="guests"
                  min="1"
                  max="30"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Table Preference: </label>
              <select>
                <option value="" disabled selected>Select an option</option>
                <option name="outside" id="outside">Outdoor Patio</option>
                <option name="bar" id="bar">Bar Area</option>
                <option name="booth" id="booth">Booth</option>
                <option name="window" id="window">Window Seat</option>
                <option name="none" id="none">No preference</option>
              </select>
            </div>
          </fieldset>

          <fieldset>
            <legend>Occasion: </legend>
            <div class="radio-group">
              <!-- wrap in spans-->
              
              <input type="radio" class="radio-option" id="occasion" name="occasion" />
              <label for="occasion">Dinner</label>
              
              <input type="radio" id="occasion" class="radio-option" name="occasion" />
              <label for="occasion">Birthday</label>
              
              <input type="radio" class="radio-option" id="occasion" name="occasion" />
              <label for="occasion">Anniversary</label>
              
              <input type="radio" class="radio-option" id="occasion" name="occasion" />
              <label for="occasion">Business</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Dietary Needs:</legend>
            <label class="checkbox-option"></label>
            <input type="checkbox" id="dietary-needs" class="checkbox-option" name="dietary-needs"/>
            <span class="dietary">Vegetarian</span>
            </label>
            <label class="checkbox-option"></label>
            <input type="checkbox" name="dietary-needs" id="dietary-needs" class="checkbox-option" />
            <span class="dietary">Gluten-free</span>
            <label class="checkbox-option"></label>
            <input type="checkbox" name="dietary-needs" id="dietary-needs" class="checkbox-option" />
            <span class="dietary">Allergies</span>
            <label class="checkbox-option"></label>
            <input type="checkbox" name="dietary-needs" id="dietary-needs" class="checkbox-option" />
            <span class="dietary">Vegan</span>
          </fieldset>

          <button type="submit" class="submit-btn">Confirm Reservation</button>
        
        </form>
      </div>
    </div>
    </main>
  </body>
</html>
